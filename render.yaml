services:
  - type: web
    name: ai-chatbot-backend
    env: python
    region: oregon
    plan: free
    rootDir: backend
    runtime: python
    pythonVersion: "3.11.9"
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt && python preload_model.py
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: GEMINI_API_KEY
        sync: false          # Set this manually in Render dashboard → Environment
      - key: GEMINI_MODEL
        value: gemini-1.5-flash
      - key: DATABASE_URL
        value: sqlite:///./app.db
      - key: CHROMA_PATH
        value: ./chroma_data
      - key: UPLOAD_DIR
        value: ./uploads
      - key: EMBEDDING_MODEL
        value: all-MiniLM-L6-v2
      - key: TOP_K
        value: "5"
      - key: CHUNK_SIZE
        value: "700"
      - key: CHUNK_OVERLAP
        value: "120"
      - key: PYTHON_VERSION
        value: "3.11.9"

services:
  - type: web
    name: ai-chatbot-backend
    env: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt && python preload_model.py
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: llama-3.1-8b-instant
      - key: DATABASE_URL
        value: sqlite:///./app.db
      - key: CHROMA_PATH
        value: ./chroma_data
      - key: UPLOAD_DIR
        value: ./uploads
      - key: EMBEDDING_MODEL
        value: all-MiniLM-L6-v2
      - key: TOP_K
        value: "5"
      - key: CHUNK_SIZE
        value: "700"
      - key: CHUNK_OVERLAP
        value: "120"
      - key: SENTENCE_TRANSFORMERS_HOME
        value: /opt/render/project/.cache/sentence-transformers
      - key: TRANSFORMERS_CACHE
        value: /opt/render/project/.cache/transformers
      - key: HF_HOME
        value: /opt/render/project/.cache/huggingface

version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ai-chatbot-backend
    restart: always
    ports:
      - "8000:8000"
    environment:
      - OLLAMA_BASE_URL=http://host.docker.internal:11434
      - OLLAMA_MODEL=${OLLAMA_MODEL:-llama3.2:3b}
      - DATABASE_URL=sqlite:///./app.db
      - CHROMA_PATH=./chroma_data
      - UPLOAD_DIR=./uploads
      - EMBEDDING_MODEL=${EMBEDDING_MODEL:-all-MiniLM-L6-v2}
      - TOP_K=${TOP_K:-5}
      - CHUNK_SIZE=${CHUNK_SIZE:-700}
      - CHUNK_OVERLAP=${CHUNK_OVERLAP:-120}
    volumes:
      - backend_uploads:/app/uploads
      - backend_chroma:/app/chroma_data
      - backend_db:/app
    depends_on:
      - ollama
    networks:
      - chatbot-network

  ollama:
    image: ollama/ollama:latest
    container_name: ai-chatbot-ollama
    restart: always
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    networks:
      - chatbot-network
    # GPU support (uncomment if your VM has a GPU)
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]

  nginx:
    image: nginx:alpine
    container_name: ai-chatbot-nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./frontend/dist:/usr/share/nginx/html:ro
      - nginx_certs:/etc/nginx/certs
    depends_on:
      - backend
    networks:
      - chatbot-network

volumes:
  backend_uploads:
  backend_chroma:
  backend_db:
  ollama_data:
  nginx_certs:

networks:
  chatbot-network:
    driver: bridge
